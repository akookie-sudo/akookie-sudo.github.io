<head>
  <!-- 1. Character Encoding & Responsive Viewport (Essential) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 2. Page Title (Shows on browser tabs and search results) -->
  <title>Akemi Lazo| Front-End Developer & Designer</title>

  <!-- 3. Page Description (Shows under your title in Google search results) -->
  <meta name="description" content="Welcome to my personal portfolio. I build web applications and design digital experiences.">

  <!-- 4. Favicon (The tiny icon on your browser tab) -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- 5. Link to your External CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- 6. Social Media Preview Meta Tags (Open Graph for sharing links) -->
  <meta property="og:title" content="Jane Doe | Portfolio">
  <meta property="og:description" content="Check out my latest web projects and work.">
  <meta property="og:image" content="preview-image.jpg">
</head>
